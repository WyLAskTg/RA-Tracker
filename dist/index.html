<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Research Application Tracker</title>
  <meta name="description" content="Track research outreach applications by semester.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Research application tracker home">
      <span class="brand-mark">R</span>
      <span>Research<br>Tracker</span>
    </a>
    <div class="header-actions">
      <button id="exportExcelBtn" class="button ghost excel-action" type="button" title="Export all semesters to an Excel workbook">Export Excel</button>
      <label class="button ghost import-label excel-action" title="Import applications from Excel">Import Excel<input id="importExcelInput" type="file" accept=".xlsx,.xls,.xlsb,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"></label>
      <button id="exportJsonBtn" class="button ghost backup-action" type="button" title="Export a JSON backup">JSON backup</button>
      <label class="button ghost import-label backup-action" title="Restore a JSON backup">Restore<input id="importJsonInput" type="file" accept="application/json"></label>
      <button id="addApplicationBtn" class="button primary" type="button"><span aria-hidden="true">＋</span> Add application</button>
    </div>
  </header>

  <main>
    <section class="workspace" aria-labelledby="semesterHeading">
      <div class="semester-bar">
        <div>
          <p class="section-label">ACTIVE TERM</p>
          <div class="semester-title-row">
            <select id="semesterSelect" aria-label="Select semester"></select>
            <button id="renameSemesterBtn" class="icon-button" type="button" title="Rename semester" aria-label="Rename semester">✎</button>
          </div>
        </div>
        <div class="semester-actions">
          <button id="addSemesterBtn" class="text-button" type="button">＋ New semester</button>
          <button id="deleteSemesterBtn" class="text-button danger-text" type="button">Delete term</button>
        </div>
      </div>

      <div id="stats" class="stats" aria-label="Application summary"></div>

      <div class="toolbar">
        <label class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Search professor, email, school, or field…" aria-label="Search applications">
        </label>
        <select id="statusFilter" aria-label="Filter by status"><option value="all">All statuses</option></select>
        <select id="sortSelect" aria-label="Sort applications">
          <option value="updated-desc">Recently updated</option>
          <option value="updated-asc">Oldest updated</option>
          <option value="professor">Professor A–Z</option>
          <option value="school">School A–Z</option>
        </select>
      </div>

      <div class="table-shell">
        <table>
          <thead><tr><th>Professor</th><th>Email</th><th>Institution</th><th>Status</th><th>Last updated</th><th>Research field</th><th>Notes</th><th aria-label="Actions"></th></tr></thead>
          <tbody id="applicationRows"></tbody>
        </table>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">✦</div>
          <h2>No applications yet</h2>
          <p>Start this semester by adding your first professor.</p>
          <button class="button primary add-from-empty" type="button">Add your first application</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="applicationDialog" class="modal">
    <form id="applicationForm" method="dialog">
      <div class="modal-head"><div><p class="section-label">APPLICATION DETAILS</p><h2 id="applicationDialogTitle">Add application</h2></div><button class="close-button" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <input id="applicationId" type="hidden">
      <div class="form-grid">
        <label>Professor name<input id="professorInput" required maxlength="100" placeholder="e.g. Dr. Jane Smith"></label>
        <label>School<input id="schoolInput" required maxlength="120" placeholder="e.g. University of Toronto"></label>
        <label class="full">Professor email<input id="emailInput" type="email" maxlength="160" placeholder="e.g. professor@university.edu"></label>
        <label class="full">Current status<select id="applicationStatus" required></select></label>
        <label>Last updated<input id="dateInput" type="date" required></label>
        <label>Research field<input id="fieldInput" required maxlength="120" placeholder="e.g. Human–computer interaction"></label>
        <label class="full">Notes<textarea id="notesInput" rows="4" maxlength="1200" placeholder="Add context, next steps, or email details…"></textarea></label>
        <section class="history-section full" aria-labelledby="historyTitle">
          <div class="history-head">
            <div><p class="section-label">CONTACT HISTORY</p><h3 id="historyTitle">Interactions</h3></div>
            <button id="showContactComposerBtn" class="button ghost compact-button" type="button">＋ Add contact</button>
          </div>
          <div id="contactComposer" class="contact-composer" hidden>
            <label>Date<input id="contactDateInput" type="date"></label>
            <label>Type<select id="contactTypeInput"><option>Initial email</option><option>Follow-up</option><option>Reply received</option><option>Meeting</option><option>Other</option></select></label>
            <label class="contact-summary">Summary<input id="contactSummaryInput" maxlength="300" placeholder="What happened?"></label>
            <div class="composer-actions"><button id="cancelContactBtn" class="text-button" type="button">Cancel</button><button id="addContactBtn" class="button primary compact-button" type="button">Add to history</button></div>
          </div>
          <div id="contactHistoryList" class="history-list"></div>
        </section>
      </div>
      <div class="modal-actions"><button class="button ghost" value="cancel" formnovalidate>Cancel</button><button id="saveApplicationBtn" class="button primary" value="default">Save application</button></div>
    </form>
  </dialog>

  <dialog id="semesterDialog" class="modal small-modal">
    <form id="semesterForm" method="dialog">
      <div class="modal-head"><div><p class="section-label">TERM</p><h2 id="semesterDialogTitle">New semester</h2></div><button class="close-button" value="cancel" formnovalidate aria-label="Close">×</button></div>
      <label>Semester name<input id="semesterNameInput" required maxlength="60" placeholder="e.g. Fall 2026"></label>
      <div class="modal-actions"><button class="button ghost" value="cancel" formnovalidate>Cancel</button><button class="button primary" value="default">Save semester</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
